<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRM Event Hub - Upcoming Events</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #121212;
            background-image: radial-gradient(ellipse at top, hsl(231, 15%, 18%) 0%, #121212 60%);
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            margin-bottom: 40px;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }
        .navbar .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }
        .navbar .nav-links a {
            color: #a0a0a5;
            text-decoration: none;
            margin-left: 25px;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        .navbar .nav-links a:hover {
            color: #0d6efd;
        }
        .header {
            text-align: center;
            margin-bottom: 50px;
        }
        .header h1 {
            color: #ffffff;
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(13, 110, 253, 0.3);
        }
        .header p {
            color: #a0a0a5;
            font-size: 1.2rem;
        }
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .event-card {
            background-color: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            text-decoration: none;
            color: inherit;
            display: block;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            opacity: 0;
            animation: fadeIn 0.5s ease-out forwards;
        }
        .event-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.7), 0 0 20px rgba(13, 110, 253, 0.3);
        }
        .event-poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #333;
            border-bottom: 2px solid #0d6efd;
        }
        .event-info {
            padding: 25px;
        }
        .event-info h2 {
            margin: 0 0 15px;
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
        }
        .event-info p {
            margin: 10px 0;
            color: #a0a0a5;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1rem;
        }
        .event-info p i {
            color: #0d6efd;
            width: 20px;
            text-align: center;
        }

        /* --- Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 1000;
        }
        .modal-overlay.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }
        .modal-overlay.visible .modal-content {
            transform: scale(1);
        }
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 2rem;
            color: #a0a0a5;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .modal-close:hover {
            color: #ffffff;
        }
        .modal-poster {
            width: 100%;
            height: 350px;
            object-fit: cover;
        }
        .modal-body {
            padding: 30px 40px;
        }
        .modal-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 20px;
        }
        .modal-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .modal-info-item {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #a0a0a5;
        }
        .modal-info-item i {
            color: #0d6efd;
            font-size: 1.5rem;
        }
        .modal-register-button {
            display: inline-block;
            background-color: #0d6efd;
            color: #fff;
            padding: 15px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }
        .modal-register-button:hover {
            background-color: #0b5ed7;
        }

        /* --- Responsive Styles for Mobile --- */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.2rem;
            }
            .header p {
                font-size: 1rem;
            }
            .navbar {
                flex-direction: column;
                gap: 10px;
                padding: 15px;
            }
            .navbar .nav-links a {
                margin: 0 10px;
            }
            .events-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .modal-content {
                width: 95%;
            }
            .modal-poster {
                height: 250px;
            }
            .modal-body {
                padding: 20px;
            }
            .modal-title {
                font-size: 1.8rem;
            }
            .modal-info-grid {
                grid-template-columns: 1fr; /* Stack items in a single column */
                gap: 20px;
            }
            .modal-register-button {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <nav class="navbar">
            <div class="logo">EventHub</div>
            <div class="nav-links">
                <a href="view-events.html">View Events</a>
                <a href="club_login.html">Club Login</a>
            </div>
        </nav>

        <div class="header">
            <h1>Upcoming Campus Events</h1>
            <p>Your central hub for all student activities and gatherings.</p>
        </div>

        <div class="events-grid" id="eventsGrid">
            <!-- Event cards will be dynamically inserted here -->
        </div>
    </div>

    <!-- Modal Structure -->
    <div id="eventModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" id="modalCloseBtn">&times;</span>
            <div id="modalBodyContent">
                <!-- Details will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const eventsGrid = document.getElementById('eventsGrid');
            const eventModal = document.getElementById('eventModal');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            const modalBodyContent = document.getElementById('modalBodyContent');
            const API_URL = 'http://localhost:5000';

            // --- Function to open the modal with event details ---
            async function openEventModal(eventId) {
                modalBodyContent.innerHTML = '<p style="padding: 40px; text-align: center;">Loading event details...</p>';
                eventModal.classList.add('visible');

                try {
                    const response = await fetch(`${API_URL}/api/events/${eventId}`);
                    if (!response.ok) throw new Error('Event not found.');
                    
                    const event = await response.json();

                    const posterUrl = `${API_URL}/${event.posterPath.replace(/\\/g, '/')}`;
                    const formatDate = (isoDate) => {
                        if (!isoDate) return 'N/A';
                        const date = new Date(isoDate);
                        return isNaN(date) ? 'Invalid Date' : date.toLocaleString('en-US', {
                            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit'
                        });
                    };

                    modalBodyContent.innerHTML = `
                        <img src="${posterUrl}" alt="${event.name} Poster" class="modal-poster">
                        <div class="modal-body">
                            <h1 class="modal-title">${event.name}</h1>
                            <div class="modal-info-grid">
                                <div class="modal-info-item">
                                    <i class="fas fa-users"></i>
                                    <div><strong>Organized by:</strong><br>${event.clubName}</div>
                                </div>
                                <div class="modal-info-item">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <div><strong>Venue:</strong><br>${event.venue}</div>
                                </div>
                                <div class="modal-info-item">
                                    <i class="fas fa-calendar-alt"></i>
                                    <div><strong>Starts:</strong><br>${formatDate(event.startDate)}</div>
                                </div>
                                <div class="modal-info-item">
                                    <i class="fas fa-calendar-check"></i>
                                    <div><strong>Ends:</strong><br>${formatDate(event.endDate)}</div>
                                </div>
                            </div>
                            ${event.registerLink ? `<a href="${event.registerLink}" class="modal-register-button" target="_blank">Register Now</a>` : ''}
                        </div>
                    `;
                } catch (error) {
                    console.error('Error fetching event details:', error);
                    modalBodyContent.innerHTML = `<p style="padding: 40px; text-align: center; color: #ff4d4d;">Could not load event details.</p>`;
                }
            }
            
            // --- Function to close the modal ---
            function closeEventModal() {
                eventModal.classList.remove('visible');
            }
            
            modalCloseBtn.addEventListener('click', closeEventModal);
            eventModal.addEventListener('click', (e) => {
                // Close if the overlay (background) is clicked
                if (e.target === eventModal) {
                    closeEventModal();
                }
            });

            // --- Fetch and display all events on page load ---
            async function fetchAndDisplayEvents() {
                try {
                    const response = await fetch(`${API_URL}/api/events?t=${new Date().getTime()}`);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const events = await response.json();

                    if (!events || events.length === 0) {
                        eventsGrid.innerHTML = '<p style="text-align: center; font-size: 1.2rem;">No upcoming events found.</p>';
                        return;
                    }

                    eventsGrid.innerHTML = '';
                    events.forEach((event, index) => {
                        const card = document.createElement('div');
                        card.className = 'event-card';
                        card.dataset.id = event._id;
                        card.style.animationDelay = `${index * 100}ms`;

                        const posterUrl = `${API_URL}/${event.posterPath.replace(/\\/g, '/')}`;
                        const formatDate = (isoDate) => {
                            if (!isoDate) return 'N/A';
                            const date = new Date(isoDate);
                            return isNaN(date) ? 'Invalid Date' : date.toLocaleString('en-US', {
                                month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
                            });
                        };
                        
                        card.innerHTML = `
                            <img src="${posterUrl}" alt="${event.name || 'Event'} Poster" class="event-poster">
                            <div class="event-info">
                                <h2>${event.name || 'Untitled Event'}</h2>
                                <p><i class="fas fa-users"></i> ${event.clubName || 'N/A'}</p>
                                <p><i class="fas fa-calendar-alt"></i> ${formatDate(event.startDate)}</p>
                                <p><i class="fas fa-map-marker-alt"></i> ${event.venue || 'N/A'}</p>
                            </div>
                        `;
                        eventsGrid.appendChild(card);
                    });

                } catch (error) {
                    console.error("Failed to fetch events:", error);
                    eventsGrid.innerHTML = '<p style="text-align: center; color: #ff4d4d;">Could not load events.</p>';
                }
            }

            // --- Add a single event listener for all card clicks ---
            eventsGrid.addEventListener('click', (e) => {
                const card = e.target.closest('.event-card');
                if (card && card.dataset.id) {
                    openEventModal(card.dataset.id);
                }
            });

            fetchAndDisplayEvents();
        });
    </script>

</body>
</html>
