<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Club</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .password-container {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6b7280;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">

    <div class="p-8 bg-white rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">Add New Club</h1>

        <form id="addClubForm" class="space-y-4">
            <div>
                <label for="clubName" class="block text-gray-700 font-medium mb-1">Club Name</label>
                <input type="text" id="clubName" name="clubName" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" required>
            </div>
            <div class="password-container">
                <label for="password" class="block text-gray-700 font-medium mb-1">Password</label>
                <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10" required>
                <i id="passwordToggle" class="fas fa-eye password-toggle"></i>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-300">
                Add Club
            </button>
        </form>

        <div id="message" class="mt-6 p-4 rounded-lg text-center font-medium hidden"></div>
    </div>

    <script>
        const form = document.getElementById('addClubForm');
        const passwordInput = document.getElementById('password');
        const passwordToggle = document.getElementById('passwordToggle');
        const message = document.getElementById('message');
        const API_URL = 'http://localhost:5000';

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'mt-6 p-4 rounded-lg text-center font-medium';
            if (type === 'success') {
                message.classList.add('bg-green-200', 'text-green-800');
            } else if (type === 'error') {
                message.classList.add('bg-red-200', 'text-red-800');
            }
            message.classList.remove('hidden');
            setTimeout(() => { message.classList.add('hidden'); }, 3000);
        }

        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordToggle.classList.toggle('fa-eye');
            passwordToggle.classList.toggle('fa-eye-slash');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const clubName = document.getElementById('clubName').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_URL}/api/clubs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: clubName, password: password }),
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage(data.message, 'success');
                    form.reset();
                } else {
                    showMessage(`Error: ${data.message}`, 'error');
                }
            } catch (error) {
                console.error('Submission failed:', error);
                showMessage('An unexpected error occurred. Please check the server connection.', 'error');
            }
        });
    </script>
</body>
</html>
