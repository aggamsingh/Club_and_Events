<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit New Event</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #121212;
            background-image: radial-gradient(ellipse at top, hsl(231, 15%, 18%) 0%, #121212 60%);
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            background-color: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
            font-size: 2rem;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr 1fr;
            }
            .full-width {
                grid-column: 1 / -1;
            }
        }
        .form-group {
            margin-bottom: 0;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #a0a0a5;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a4a4c;
            background-color: #3c3c3e;
            color: #f0f0f0;
            box-sizing: border-box;
            font-size: 1rem;
        }
        input[type="file"] {
            padding: 8px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #0d6efd;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0b5ed7;
        }
        .message {
            text-align: center;
            padding: 12px;
            margin-top: 20px;
            border-radius: 8px;
            display: none;
        }
        .message.success { background-color: #28a745; color: white; }
        .message.error { background-color: #dc3545; color: white; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2 id="formTitle">Submit a New Event</h2>
        <form id="eventForm" class="form-grid">
            
            <div class="form-group full-width">
                <label for="name">Event Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="startDate">Event Start Date & Time</label>
                <input type="datetime-local" id="startDate" name="startDate" required>
            </div>

            <div class="form-group">
                <label for="endDate">Event End Date & Time</label>
                <input type="datetime-local" id="endDate" name="endDate" required>
            </div>

            <div class="form-group full-width">
                <label for="venue">Venue</label>
                <input type="text" id="venue" name="venue" required>
            </div>

            <div class="form-group full-width">
                <label for="poster">Event Poster</label>
                <input type="file" id="poster" name="poster" accept="image/*">
                <small id="posterHelp" style="color: #a0a0a5; display: block; margin-top: 5px;">Only required when creating a new event. Leave empty if you don't want to change the poster.</small>
            </div>

            <div class="form-group full-width">
                <label for="registerLink">Registration Link (Optional)</label>
                <input type="url" id="registerLink" name="registerLink" placeholder="https://example.com/register">
            </div>

            <div class="form-group full-width">
                <label for="password">Club Password (for verification)</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group full-width">
                <button type="submit" id="submitBtn">Submit Event</button>
            </div>
        </form>
        <div id="message" class="message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const eventForm = document.getElementById('eventForm');
            const messageDiv = document.getElementById('message');
            const formTitle = document.getElementById('formTitle');
            const submitBtn = document.getElementById('submitBtn');
            const posterInput = document.getElementById('poster');
            const posterHelpText = document.getElementById('posterHelp');
            const API_URL = 'http://localhost:5000';

            const urlParams = new URLSearchParams(window.location.search);
            const eventId = urlParams.get('edit');
            const isEditMode = !!eventId;

            // --- 1. Authentication Check ---
            const loggedInClubName = sessionStorage.getItem('loggedInClubName');
            if (!loggedInClubName) {
                alert('You must be logged in to submit an event.');
                window.location.href = 'club_login.html';
                return;
            }

            // --- 2. Setup Form for Create or Edit Mode ---
            if (isEditMode) {
                formTitle.textContent = 'Edit Event';
                submitBtn.textContent = 'Update Event';
                posterInput.required = false;
                
                // Fetch existing event data and populate the form
                async function fetchEventData() {
                    try {
                        const response = await fetch(`${API_URL}/api/events/${eventId}`);
                        if (!response.ok) throw new Error('Could not fetch event data.');
                        const event = await response.json();

                        // Populate fields
                        document.getElementById('name').value = event.name;
                        document.getElementById('venue').value = event.venue;
                        document.getElementById('registerLink').value = event.registerLink || '';
                        
                        // Format dates for datetime-local input (YYYY-MM-DDTHH:mm)
                        const toLocalISOString = (date) => {
                            const dt = new Date(date);
                            const tzo = -dt.getTimezoneOffset();
                            const pad = (num) => (num < 10 ? '0' : '') + num;
                            return dt.getFullYear() + '-' +
                                pad(dt.getMonth() + 1) + '-' +
                                pad(dt.getDate()) + 'T' +
                                pad(dt.getHours()) + ':' +
                                pad(dt.getMinutes());
                        };

                        if (event.startDate) document.getElementById('startDate').value = toLocalISOString(event.startDate);
                        if (event.endDate) document.getElementById('endDate').value = toLocalISOString(event.endDate);

                    } catch (error) {
                        showMessage(error.message, 'error');
                    }
                }
                fetchEventData();
            }

            // --- 3. Handle Form Submission ---
            eventForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const formData = new FormData(eventForm);
                formData.append('clubName', loggedInClubName); // Add logged-in club name

                const url = isEditMode ? `${API_URL}/api/events/${eventId}` : `${API_URL}/api/events`;
                const method = isEditMode ? 'PUT' : 'POST';

                try {
                    const response = await fetch(url, {
                        method: method,
                        body: formData
                    });

                    const result = await response.json();
                    if (!response.ok) throw new Error(result.message);

                    showMessage(result.message, 'success');
                    setTimeout(() => {
                        window.location.href = 'club_dashboard.html'; // Redirect to dashboard on success
                    }, 1500);

                } catch (error) {
                    showMessage(error.message, 'error');
                }
            });

            function showMessage(text, type) {
                messageDiv.textContent = text;
                messageDiv.className = `message ${type}`;
                messageDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
