<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        body {
            background-color: #121212;
            background-image: radial-gradient(ellipse at top, hsl(231, 15%, 18%) 0%, #121212 60%);
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            background-color: rgba(30, 30, 30, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #ffffff;
            font-size: 2rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #a0a0a5;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #4a4a4c;
            background-color: #3c3c3e;
            color: #f0f0f0;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .password-container {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0a0a5;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #0d6efd;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #0b5ed7;
        }
        .error-message {
            text-align: center;
            padding: 12px;
            margin-top: 20px;
            border-radius: 8px;
            display: none; /* Hidden by default */
            background-color: #dc3545;
            color: white;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Club Admin Login</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="clubName">Club Name</label>
                <select id="clubName" name="clubName" required>
                    <option value="" disabled selected>Loading clubs...</option>
                </select>
            </div>
            <div class="form-group password-container">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <i id="passwordToggle" class="fas fa-eye password-toggle"></i>
            </div>
            <button type="submit">Login</button>
        </form>
        <div id="errorMessage" class="error-message"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const clubNameSelect = document.getElementById('clubName');
            const loginForm = document.getElementById('loginForm');
            const errorMessageDiv = document.getElementById('errorMessage');
            const passwordInput = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');
            const API_URL = 'http://localhost:5000';

            // --- Toggle Password Visibility ---
            passwordToggle.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                passwordToggle.classList.toggle('fa-eye');
                passwordToggle.classList.toggle('fa-eye-slash');
            });

            // --- Fetch clubs and populate the dropdown ---
            async function fetchClubs() {
                try {
                    const response = await fetch(`${API_URL}/api/clubs`);
                    if (!response.ok) throw new Error('Could not fetch clubs.');
                    
                    const clubs = await response.json();
                    
                    clubNameSelect.innerHTML = '<option value="" disabled selected>Select your club</option>';
                    clubs.forEach(club => {
                        const option = document.createElement('option');
                        option.value = club.name;
                        option.textContent = club.name;
                        clubNameSelect.appendChild(option);
                    });
                } catch (error) {
                    console.error('Failed to fetch clubs:', error);
                    clubNameSelect.innerHTML = '<option value="" disabled selected>Could not load clubs</option>';
                }
            }

            // --- Handle the login form submission ---
            loginForm.addEventListener('submit', async function(event) {
                event.preventDefault();
                errorMessageDiv.style.display = 'none';

                const clubName = clubNameSelect.value;
                const password = passwordInput.value;

                if (!clubName) {
                    errorMessageDiv.textContent = 'Please select a club.';
                    errorMessageDiv.style.display = 'block';
                    return;
                }

                try {
                    const response = await fetch(`${API_URL}/api/auth`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: clubName, password: password })
                    });
                    
                    const responseBody = await response.text();
                    
                    if (!response.ok) {
                        try {
                            const errorData = JSON.parse(responseBody);
                            throw new Error(errorData.message || 'An unknown error occurred.');
                        } catch (e) {
                            throw new Error('Server returned an unexpected response. Please check the backend console.');
                        }
                    }

                    sessionStorage.setItem('loggedInClubName', clubName);
                    window.location.href = 'club_dashboard.html';

                } catch (error) {
                    errorMessageDiv.textContent = error.message;
                    errorMessageDiv.style.display = 'block';
                }
            });

            fetchClubs();
        });
    </script>

</body>
</html>
